name: CI & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  meson-test:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          dnf install -y gcc meson ninja-build gtk4-devel libadwaita-devel \
            appstream desktop-file-utils

      - name: Configure, build, and test
        run: |
          meson setup build
          meson compile -C build
          meson test -C build -v
          desktop-file-validate data/io.github.spondle.Paint.desktop
          appstreamcli validate --no-net data/io.github.spondle.Paint.metainfo.xml

  flatpak:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: io.github.spondle.Paint.flatpak
          manifest-path: packaging/flatpak/io.github.spondle.Paint.yml

      - name: Publish Release bundle on version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: io.github.spondle.Paint.flatpak
