app-id: io.github.spondle.Paint
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: paint
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
modules:
  - name: paint
    buildsystem: meson
    sources:
      - type: dir
        path: ../..
        skip:
          - build
          - .flatpak-builder
          - .git
